    #splash { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0;
      padding: env(safe-area-inset-top) 24px calc(24px + env(safe-area-inset-bottom)); box-sizing: border-box;
      background: radial-gradient(120% 80% at 50% 30%, #12809F 0%, #0B5F7C 55%, #08435A 100%); color: #fff;
      font-family: Georgia, 'Times New Roman', serif; transition: opacity .45s ease, transform .45s ease; }
    #splash.sp-hide { opacity: 0; transform: scale(1.04); pointer-events: none; }
    #splash .sp-mark { width: min(44vw, 170px); height: auto; overflow: visible; }
    #splash .sp-road { opacity: 0; animation: sp-fade .5s ease-out forwards; }
    #splash .sp-dash { opacity: 0; animation: sp-fade .5s ease-out forwards; }
    #splash .sp-pin { transform-box: fill-box; transform-origin: 50% 100%; opacity: 0; animation: sp-fade .5s ease-out forwards; }
    #splash .sp-word { width: min(58vw, 230px); height: auto; margin-top: 22px; opacity: 0; animation: sp-in .6s .5s ease-out forwards; }
    #splash .sp-tag { margin-top: 10px; font-size: 15px; opacity: .85; text-align: center; animation: sp-up .6s .6s ease-out both; }
    #splash .sp-skip { margin-top: 18px; font-size: 13px; color: rgba(255,255,255,.65); opacity: 0; animation: sp-in .6s .8s ease-out forwards; font-family: system-ui, sans-serif; }
    #splash.sp-quick .sp-skip { display: none; }
    #splash .sp-bar { margin-top: 26px; width: 140px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.2); overflow: hidden; }
    #splash .sp-bar i { display: block; width: 40%; height: 100%; border-radius: 2px; background: #FFC75F; animation: sp-load 1.2s ease-in-out infinite; }
    #splash .sp-credit { position: absolute; bottom: calc(22px + env(safe-area-inset-bottom)); display: inline-flex; align-items: center; gap: 7px; min-height: 44px; padding: 0 12px;
      color: rgba(255,255,255,.88); font: 600 13px/1 system-ui, -apple-system, sans-serif; text-decoration: none; letter-spacing: .01em; }
    @keyframes sp-draw { 0% { stroke-dashoffset: 100; opacity: 0; } 4% { opacity: 1; } 100% { stroke-dashoffset: 0; opacity: 1; } }
    @keyframes sp-fade { to { opacity: 1; } }
    @keyframes sp-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @keyframes sp-drop { 0% { opacity: 0; transform: translateY(-40%) scale(.6); } 100% { opacity: 1; transform: none; } }
    @keyframes sp-up { from { opacity: 0; transform: translateY(10px); } }
    @keyframes sp-load { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }
    @media (prefers-reduced-motion: reduce) { #splash *, #splash { animation: none !important; transition: none !important; }
      #splash .sp-road { stroke-dashoffset: 0; opacity: 1; } #splash .sp-dash, #splash .sp-pin, #splash .sp-word { opacity: 1; } #splash .sp-car { display: none; } }
    /* Later opens in the same visit: the finished logo, no drive. */
    #splash.sp-quick *, #splash.sp-quick { animation-duration: .01s !important; animation-delay: 0s !important; } #splash.sp-quick .sp-car { display: none; }
