  <style>
    #splash { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0;
      padding: env(safe-area-inset-top) 24px calc(24px + env(safe-area-inset-bottom)); box-sizing: border-box;
      background: radial-gradient(120% 80% at 50% 30%, #12809F 0%, #0B5F7C 55%, #08435A 100%); color: #fff;
      font-family: Georgia, 'Times New Roman', serif; transition: opacity .45s ease, transform .45s ease; }
    #splash.sp-hide { opacity: 0; transform: scale(1.04); pointer-events: none; }
    #splash .sp-card { width: min(62vw, 260px); aspect-ratio: 1; border-radius: 22%; overflow: hidden; box-shadow: 0 30px 60px -20px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.12);
      animation: sp-pop .7s cubic-bezier(.2,.9,.3,1.3) both; }
    #splash .sp-art { display: block; width: 100%; height: 100%; }
    #splash .sp-name { margin-top: 26px; font-size: 38px; font-weight: 700; letter-spacing: -.01em; animation: sp-up .6s .15s ease-out both; }
    #splash .sp-tag { margin-top: 6px; font-size: 15px; opacity: .85; text-align: center; animation: sp-up .6s .25s ease-out both; }
    #splash .sp-bar { margin-top: 26px; width: 140px; height: 4px; border-radius: 2px; background: rgba(255,255,255,.2); overflow: hidden; }
    #splash .sp-bar i { display: block; width: 40%; height: 100%; border-radius: 2px; background: #FFC75F; animation: sp-load 1.2s ease-in-out infinite; }
    #splash .sp-credit { position: absolute; bottom: calc(22px + env(safe-area-inset-bottom)); display: inline-flex; align-items: center; gap: 7px; min-height: 44px; padding: 0 12px;
      color: rgba(255,255,255,.88); font: 600 13px/1 system-ui, -apple-system, sans-serif; text-decoration: none; letter-spacing: .01em; }
    @keyframes sp-pop { from { opacity: 0; transform: scale(.8) translateY(10px); } }
    @keyframes sp-up { from { opacity: 0; transform: translateY(10px); } }
    @keyframes sp-load { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }
    @media (prefers-reduced-motion: reduce) { #splash *, #splash { animation: none !important; transition: none !important; } }
  </style>
