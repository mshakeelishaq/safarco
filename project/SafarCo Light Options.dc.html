<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="design_doc_mode" content="canvas">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>body{margin:0;background:#E9EDED;font-family:'Plus Jakarta Sans',system-ui,sans-serif}a{color:#08905C}a:hover{color:#0D2B2E}</style>
</helmet>
<section style="padding:48px 40px;display:flex;flex-direction:column;gap:24px">
<div style="display:flex;flex-direction:column;gap:6px">
<div style="font-size:28px;font-weight:800;color:#0D2B2E;letter-spacing:-.02em">SafarCo, light themes</div>
<div style="font-size:15px;font-weight:500;color:#4A6266">Same app and logic, three light palettes. Each phone is live.</div>
</div>
<div style="display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start">
<div id="1a" style="display:flex;flex-direction:column;gap:12px">
<div style="display:flex;align-items:center;gap:10px"><span style="padding:4px 10px;border-radius:8px;background:#0D2B2E;color:#fff;font-size:13px;font-weight:800">1a</span><span style="font-size:16px;font-weight:800;color:#0D2B2E">Daylight</span><span style="font-size:13px;color:#4A6266;font-weight:500">Sky blue, white glass, mint</span></div>
<div style="width:484px;height:944px;border-radius:40px;overflow:hidden">
<dc-import name="SafarCo App v6" theme="daylight" hint-size="484px,944px"></dc-import>
</div>
</div>
<div id="1b" style="display:flex;flex-direction:column;gap:12px">
<div style="display:flex;align-items:center;gap:10px"><span style="padding:4px 10px;border-radius:8px;background:#0D2B2E;color:#fff;font-size:13px;font-weight:800">1b</span><span style="font-size:16px;font-weight:800;color:#0D2B2E">Peach sunset</span><span style="font-size:13px;color:#4A6266;font-weight:500">Warm cream, coral to pink</span></div>
<div style="width:484px;height:944px;border-radius:40px;overflow:hidden">
<dc-import name="SafarCo App v6" theme="peach" hint-size="484px,944px"></dc-import>
</div>
</div>
<div id="1c" style="display:flex;flex-direction:column;gap:12px">
<div style="display:flex;align-items:center;gap:10px"><span style="padding:4px 10px;border-radius:8px;background:#0D2B2E;color:#fff;font-size:13px;font-weight:800">1c</span><span style="font-size:16px;font-weight:800;color:#0D2B2E">Paper</span><span style="font-size:13px;color:#4A6266;font-weight:500">Broadsheet: serif, cyan and magenta</span></div>
<div style="width:484px;height:944px;border-radius:40px;overflow:hidden">
<dc-import name="SafarCo App v6" theme="paper" hint-size="484px,944px"></dc-import>
</div>
</div>
</div>
</section>
</x-dc>
</body>
</html>
